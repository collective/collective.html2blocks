---
setup:
  argnames: ["name", "src", "converter", "plate_format", "path", "expected"]
  test_args: ["path", "expected"]
params:
  - name: Empty
    src: ""
    converter: slate
    plate_format: null
    tests:
      - path: "len:"
        expected: 0

  - name: Simple Case
    src: |
      <div><p>Hello World!</p></div>
    converter: slate
    plate_format: null
    tests:
      - path: "len:"
        expected: 1
      - path: "0/@type"
        expected: "slate"
      - path: "0/plaintext"
        expected: "Hello World!"
      - path: "len:0/value"
        expected: 1
      - path: "0/value/0/type"
        expected: "p"
      - path: "0/value/0/children/0/text"
        expected: "Hello World!"

  - name: Slate ignores the Plate format
    src: |
      <p>Hello</p>
    converter: slate
    plate_format: somersault
    tests:
      - path: "len:"
        expected: 1
      - path: "0/@type"
        expected: "slate"

  - name: Plate
    src: |
      <p>Hello <strong>world</strong></p>
    converter: plate
    plate_format: null
    tests:
      - path: "len:"
        expected: 1
      - path: "0/@type"
        expected: "plate"
      - path: "0/value/0/type"
        expected: "p"
      - path: "0/value/0/children/1"
        expected: {text: world, bold: true}

  - name: Plate in main format
    src: |
      <p>Hello</p>
    converter: plate
    plate_format: main
    tests:
      - path: ""
        expected:
          - "@type": plate
            value: [{type: p, children: [{text: Hello}], blockWidth: default}]

  - name: Plate in somersault format
    src: |
      <p>Hello <strong>world</strong></p>
    converter: plate
    plate_format: somersault
    tests:
      - path: ""
        expected:
          - "@type": __somersault__
            value:
              - type: p
                children: [{text: "Hello "}, {text: world, bold: true}]
                blockWidth: default
