---
setup:
  argnames: ["name", "src", "path", "expected"]
  test_args: ["path", "expected"]
params:

  - name: soundcloud
    src: '<iframe width="480" height="270" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/1275507478&amp;color=%23ff5500&amp;auto_play=false&amp;hide_related=false&amp;show_comments=true&amp;show_user=true&amp;show_reposts=false&amp;show_teaser=true&amp;visual=true" allowfullscreen></iframe>'
    tests:
      - path: "0/@type"
        expected: 'soundcloudBlock'
      - path: "0/soundcloudId"
        expected: '1275507478'

  - name: YouTube 01
    src: '<iframe width="480" height="270" src="https://www.youtube.com/embed/44CE2XOFS98" allowfullscreen></iframe>'
    tests:
      - path: "0/@type"
        expected: 'video'
      - path: "0/url"
        expected: https://youtu.be/44CE2XOFS98

  - name: YouTube 02
    src: '<iframe width="480" height="270" src="https://www.youtube.com/embed/45r8eU5McWY?feature=oembed" allowfullscreen></iframe>'
    tests:
      - path: "0/@type"
        expected: 'video'
      - path: "0/url"
        expected: https://youtu.be/45r8eU5McWY

  - name: YouTube 03
    src: '<iframe width="480" height="270" src="https://www.youtube.com/embed/47kARG37pUs?feature=oembed" allowfullscreen></iframe>'
    tests:
      - path: "0/@type"
        expected: 'video'
      - path: "0/url"
        expected: https://youtu.be/47kARG37pUs

  - name: YouTube 04
    src: '<iframe width="480" height="270" src="https://www.youtube.com/embed/49wYuZR1RpI?feature=oembed" allowfullscreen></iframe>'
    tests:
      - path: "0/@type"
        expected: 'video'
      - path: "0/url"
        expected: https://youtu.be/49wYuZR1RpI

  - name: YouTube 05
    src: '<iframe width="480" height="270" src="https://www.youtube.com/embed/4OUAlDfN2p0?feature=oembed" allowfullscreen></iframe>'
    tests:
      - path: "0/@type"
        expected: 'video'
      - path: "0/url"
        expected: https://youtu.be/4OUAlDfN2p0

  - name: YouTube 06
    src: '<iframe width="480" height="270" src="https://www.youtube.com/embed/4SIY72714lw?feature=oembed" allowfullscreen></iframe>'
    tests:
      - path: "0/@type"
        expected: 'video'
      - path: "0/url"
        expected: https://youtu.be/4SIY72714lw

  - name: YouTube 07
    src: '<iframe width="480" height="270" src="https://www.youtube.com/embed/4hJAxcKbv6Y?feature=oembed" allowfullscreen></iframe>'
    tests:
      - path: "0/@type"
        expected: 'video'
      - path: "0/url"
        expected: https://youtu.be/4hJAxcKbv6Y

  - name: YouTube 08
    src: '<iframe width="480" height="270" src="https://www.youtube.com/embed/4ifeX38vKGU?feature=oembed" allowfullscreen></iframe>'
    tests:
      - path: "0/@type"
        expected: 'video'
      - path: "0/url"
        expected: https://youtu.be/4ifeX38vKGU

  - name: Anchor.fm
    src: '<iframe width="480" height="270" src="https://anchor.fm/oassuntoe/embed/episodes/O-Assunto----Agrotxicos-enm3en" allowfullscreen></iframe>'
    tests:
      - path: "0/@type"
        expected: 'iframe'
      - path: "0/src"
        expected: https://anchor.fm/oassuntoe/embed/episodes/O-Assunto----Agrotxicos-enm3en
      - path: "0/height"
        expected: '270'

  - name: "Issue 35: iframe height from style"
    src: '<iframe src="https://example.org/embed" style="width: 100%; height: 800px"></iframe>'
    tests:
      - path: "0/@type"
        expected: 'iframe'
      - path: "0/height"
        expected: '800px'

  - name: iframe without height
    src: '<iframe src="https://example.org/embed"></iframe>'
    tests:
      - path: "0/height"
        expected: '200px'

  - name: Google Maps embed
    src: '<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3769.6&amp;hl=pt-BR" width="600" height="450" title="Sede" allowfullscreen loading="lazy"></iframe>'
    tests:
      - path: "0/@type"
        expected: 'maps'
      - path: "0/url"
        expected: https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3769.6&hl=pt-BR
      - path: "0/title"
        expected: 'Sede'

  - name: Google Maps classic embed
    src: '<iframe src="https://maps.google.com/maps?q=Uberl%C3%A2ndia&amp;output=embed"></iframe>'
    tests:
      - path: "0/@type"
        expected: 'maps'
      - path: "0/url"
        expected: https://maps.google.com/maps?q=Uberl%C3%A2ndia&output=embed

  - name: Google Maps place page is not an embed of another host
    src: '<iframe src="https://www.google.com.evil.example/maps/embed?pb=1"></iframe>'
    tests:
      - path: "0/@type"
        expected: 'iframe'

  - name: Vimeo player
    src: '<iframe src="https://player.vimeo.com/video/76979871?h=8272103f6e&amp;title=0" width="640" height="360" allowfullscreen></iframe>'
    tests:
      - path: "0/@type"
        expected: 'video'
      - path: "0/url"
        expected: https://vimeo.com/76979871

  - name: Vimeo page
    src: '<iframe src="https://vimeo.com/76979871"></iframe>'
    tests:
      - path: "0/@type"
        expected: 'video'
      - path: "0/url"
        expected: https://vimeo.com/76979871

  - name: Vimeo protocol-relative
    src: '<iframe src="//player.vimeo.com/video/76979871"></iframe>'
    tests:
      - path: "0/url"
        expected: https://vimeo.com/76979871

  - name: Vimeo showcase is not a video
    src: '<iframe src="https://vimeo.com/showcase/123"></iframe>'
    tests:
      - path: "0/@type"
        expected: 'iframe'
